<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Komunitas</title>
    
    <!-- Memanggil File Manifest Resmi -->
    <link rel="manifest" href="manifest.json">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <iframe id="app"></iframe>

    <script>
        // URL Aplikasi GAS Anda
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyG4D-nC5F78C7JzuvPNTJDIWGZ680kz3tZ8r5NjyG3Cm8P0Zn2__aj2FG-VG7bOLWR/exec";

        // Teruskan parameter URL (role, toko, dll) ke GAS
        document.getElementById('app').src = GAS_URL + location.search;

        // Mendaftarkan File Service Worker Resmi
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Terdaftar!"))
            .catch(err => console.log("Gagal:", err));
        }
    </script>
</body>
</html>
